<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siguiente paso...</title>
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .tarjeta {
            background: #2a2a40;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 30px;
            color: #f5f6fa;
            line-height: 1.4;
        }
        h2 {
            color: #f5f6fa;
        }
        .botones {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-si { background-color: #2ecc71; color: white; }
        .btn-no { background-color: #e74c3c; color: white; }
        .btn-enviar { background-color: #3498db; color: white; margin-top: 15px; width: 100%;}

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #444460;
            background-color: #1e1e2f;
            color: white;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* Ocultar las otras pantallas por defecto */
        #pantalla-motivo, #pantalla-vamooos, #pantalla-gracias {
            display: none;
        }

        .texto-vamooos {
            font-size: 45px;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        
        <!-- PANTALLA 1 -->
        <div id="pantalla-pregunta">
            <h1>¿Ahora que creé esta página, se abrió una posibilidad o no?</h1>
            <div class="botones">
                <button type="button" class="btn-si" onclick="elegirOpcion(true)">Sí</button>
                <button type="button" class="btn-no" onclick="elegirOpcion(false)">No</button>
            </div>
        </div>

        <!-- PANTALLA 2 -->
        <div id="pantalla-motivo">
            <h2>¿Por qué?</h2>
            <textarea id="texto-motivo" placeholder="Escribe tu razón aquí..."></textarea>
            <button type="button" class="btn-enviar" onclick="enviarRespuestaNegativa()">Enviar respuesta</button>
        </div>

        <!-- PANTALLA 3 -->
        <div id="pantalla-vamooos">
            <h1 class="texto-vamooos">¡Vaamooos!</h1>
            <p>¡Gracias por confiar!</p>
        </div>

        <!-- PANTALLA 4 -->
        <div id="pantalla-gracias">
            <h2>Gracias por tu sinceridad</h2>
            <p>Tu respuesta ha sido enviada.</p>
        </div>

    </div>

    <!-- Formulario oculto con TU URL DE FORMSPREE -->
    <form id="formulario-oculto" action="https://formspree.io/f/xyezdvel" method="POST" style="display: none;">
        <input type="hidden" name="Pregunta" value="¿Se abrio una posibilidad o no?">
        <input type="hidden" name="Respuesta" id="input-respuesta">
        <input type="hidden" name="Por_que" id="input-motivo">
    </form>

    <script>
        function mostrarPantalla(id) {
            document.getElementById('pantalla-pregunta').style.display = 'none';
            document.getElementById('pantalla-motivo').style.display = 'none';
            document.getElementById('pantalla-vamooos').style.display = 'none';
            document.getElementById('pantalla-gracias').style.display = 'none';
            
            document.getElementById(id).style.display = 'block';
        }

        function elegirOpcion(esPositivo) {
            try {
                if (esPositivo) {
                    document.getElementById('input-respuesta').value = "Si";
                    mostrarPantalla('pantalla-vamooos');
                    
                    if (typeof confetti !== 'undefined') {
                        lanzarConfeti();
                    }
                    
                    enviarAFormspree();
                } else {
                    document.getElementById('input-respuesta').value = "No";
                    mostrarPantalla('pantalla-motivo');
                }
            } catch (error) {
                alert("Hubo un error al hacer clic: " + error.message);
            }
        }

        function enviarRespuestaNegativa() {
            try {
                const motivo = document.getElementById('texto-motivo').value;
                document.getElementById('input-motivo').value = motivo || "No quiso especificar";
                
                mostrarPantalla('pantalla-gracias');
                enviarAFormspree();
            } catch (error) {
                alert("Hubo un error al enviar: " + error.message);
            }
        }

        function lanzarConfeti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#2ecc71', '#f1c40f', '#3498db']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#2ecc71', '#f1c40f', '#3498db']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        async function enviarAFormspree() {
            const form = document.getElementById('formulario-oculto');
            
            try {
                await fetch(form.action, {
                    method: form.method,
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });
            } catch (error) {
                console.log("Error de red al enviar el formulario.");
            }
        }
    </script>
</body>
</html>
